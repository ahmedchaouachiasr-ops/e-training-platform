{% extends 'base.html' %} 

{% block content %}
<div class="form-container large" style="margin-top: 20px;">
  <h2 style="margin-bottom: 30px;">
    {% if object %}
      Modifier le cours: {{ object.titre }}
    {% else %}
      Créer un nouveau cours
    {% endif %}
  </h2>

  <form method="post">
    {% csrf_token %}
    <div style="display: flex; flex-direction: column; gap: 15px;">
        {{ form.as_p }}
    </div>
    
    <div class="form-actions" style="margin-top: 30px; display: flex; gap: 15px;">
      <a href="{% url 'cours_list' %}" class="btn btn-secondary">Annuler</a>
      <button type="submit" class="btn btn-primary">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
